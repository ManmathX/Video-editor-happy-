# App desktop (finestra + CLI `vedit`) per Windows e macOS.
#
# A mano: Actions -> desktop -> Run workflow. A ogni tag "v*" anche una release
# GitHub con i file. Gli artefatti dell'esecuzione sono l'installatore Windows,
# la versione portatile per Windows e il .app per macOS (Apple Silicon).
#
# Ogni app viene provata dopo la costruzione (scripts/build_desktop.py --prova):
# si avvia, serve l'interfaccia, risponde MCP su HTTP e su stdio, e gli extra
# installati qui si importano davvero dentro l'app.
name: desktop

on:
  workflow_dispatch:
    inputs:
      vision:
        description: "Include subject detection (YOLO + PyTorch: about +1.5 GB)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
    # e a ogni modifica dell'app, su qualunque ramo: l'app scaricabile resta quella
    # del codice, e l'impacchettamento si rompe senza che la suite se ne accorga
    # (sui tag i path non contano)
    branches: ["**"]
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/package*.json"
      - "pyproject.toml"
      - "desktop/**"
      - "scripts/build_desktop.py"
      - ".github/workflows/desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: interfaccia
        working-directory: frontend
        run: npm ci && npm run build

      # tutti gli extra: l'app non puo' fare `pip install` dopo
      - name: dipendenze
        run: |
          python -m pip install --upgrade pip
          EXTRA="chat,desktop,transcribe,html,web,plugin"
          if [ "${{ inputs.vision }}" = "true" ]; then EXTRA="$EXTRA,vision"; fi
          python -m pip install -e ".[$EXTRA]" "pyinstaller>=6.10"

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: |
          if ! command -v iscc >/dev/null && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: impacchetta
        run: python scripts/build_desktop.py --no-ui ${{ runner.os == 'Windows' && '--installer' || '' }}

      - name: prova l'app impacchettata
        run: python scripts/build_desktop.py --prova

      - name: archivi
        run: |
          cd dist-desktop
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "Topper Mode Video Editor-Windows-portable.zip" "Topper Mode Video Editor" >/dev/null
          else
            # ditto, non zip: tiene link simbolici e firme dei framework dentro il .app
            ditto -c -k --keepParent "Topper Mode Video Editor.app" "Topper Mode Video Editor-macOS.zip"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist-desktop/*.zip
            dist-desktop/*Setup*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
